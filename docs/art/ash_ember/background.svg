<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ash & Ember sample stage: layered ash-grey planes + fog + lantern light from the party side (left) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2730"/>
      <stop offset="0.65" stop-color="#5A5560"/>
      <stop offset="1" stop-color="#6E6872"/>
    </linearGradient>
    <radialGradient id="lantern" cx="0" cy="0.78" r="0.9">
      <stop offset="0" stop-color="#F2A541" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#F2A541" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F2A541" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloam" cx="1" cy="0.55" r="0.7">
      <stop offset="0" stop-color="#5FD3C6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5FD3C6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- far plane: dead treeline + broken spire -->
  <path fill="#4A4650" d="M0 330 L0 300 L18 296 L22 262 L26 296 L52 292 L60 250 L66 290 L96 286 L104 238 L110 284 L150 290 L160 276 L176 288 L214 284 L222 210 L226 200 L230 210 L238 284 L270 288 L284 270 L296 290 L330 286 L338 244 L344 286 L380 292 L392 264 L398 292 L436 288 L446 252 L452 288 L490 294 L500 270 L506 296 L512 296 L512 330 Z"/>
  <rect x="0" y="318" width="512" height="18" fill="#6E6872" fill-opacity="0.35"/>
  <!-- mid plane: crypt wall, arches, a dead lantern post -->
  <path fill="#35323B" d="M0 400 L0 352 L40 346 L40 330 L56 330 L56 344 L120 338 L136 336 L190 342 L250 340 L320 344 L340 330 L356 330 L362 342 L430 340 L470 348 L512 344 L512 400 Z"/>
  <path fill="#2A2730" d="M150 342 C150 316 186 316 186 342 Z M394 342 C394 320 424 320 424 342 Z"/>
  <path fill="#35323B" d="M466 348 L470 250 L476 250 L480 348 Z M458 252 L488 252 L488 258 L458 258 Z M464 258 L482 258 L480 282 L466 282 Z"/>
  <rect x="0" y="384" width="512" height="22" fill="#6E6872" fill-opacity="0.22"/>
  <!-- near ground -->
  <path fill="#1A181D" d="M0 512 L0 456 C80 446 160 452 256 448 C352 444 432 452 512 446 L512 512 Z"/>
  <path fill="#141216" d="M0 512 L0 480 L30 476 L36 466 L44 476 L120 482 L400 480 L470 474 L476 462 L484 474 L512 472 L512 512 Z"/>
  <!-- lantern light + gloam haze -->
  <rect width="512" height="512" fill="url(#lantern)"/>
  <rect width="512" height="512" fill="url(#gloam)"/>
  <!-- drifting ash -->
  <g fill="#D9D2C3" fill-opacity="0.35">
    <circle cx="60" cy="120" r="1.6"/><circle cx="140" cy="70" r="1.2"/><circle cx="300" cy="96" r="1.5"/>
    <circle cx="420" cy="150" r="1.2"/><circle cx="470" cy="60" r="1.6"/><circle cx="210" cy="180" r="1.1"/>
    <circle cx="360" cy="210" r="1.4"/><circle cx="90" cy="230" r="1.2"/><circle cx="250" cy="40" r="1.3"/>
  </g>
</svg>
