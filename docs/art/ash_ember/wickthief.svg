  <path fill="#1C1A1E" d="
    M220 266
    L242 222 Q270 198 306 196 Q342 196 362 222 Q378 246 380 280 Q382 304 376 322
    L398 360 L374 352 L382 392 L360 364 L352 404 L336 368 L322 402 L310 366 L296 392 L288 362
    L272 380 L266 352 L252 362 L252 342 Q228 318 220 266 Z"/>

