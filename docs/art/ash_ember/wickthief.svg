  <circle cx="210" cy="240" r="13" fill="#5FD3C6" fill-opacity="0.13"/>
  <path fill="#5FD3C6" d="M180 250 L198 240 L199 245 L184 253 Z"/>
  <path fill="#5FD3C6" d="M204 240 L219 232 L220 237 L207 244 Z"/>
