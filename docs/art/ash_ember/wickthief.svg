<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- WICKTHIEF — Ashen Lantern original enemy. Faces left (toward the party).
       VectorDrawable-safe: paths/circles only, flat fills + fill-opacity, no filters/masks.
       Palette: void #0B0A0C, soot #1C1A1E, far-soot #141216, rim #3A3640, wax #2A262C,
                gloam #5FD3C6, amber #F2A541, amber-core #FFD27A -->

  <!-- far leg -->
  <path fill="#141216" d="M322 346 L304 398 L334 444 L330 452 L300 462 L276 476 L262 476 L268 470 L292 456 L318 446 L292 404 L304 346 Z"/>
  <!-- far arm, clawing backward -->
  <path fill="#141216" d="M350 236 L404 270 L428 258 L446 262 L432 268 L450 274 L430 278 L442 290 L424 284 L402 288 L344 256 Z"/>

  <!-- lantern-hook staff -->
  <path fill="#1C1A1E" d="M126 478 L136 478 L164 160 C166 136 156 118 136 112 C114 106 94 118 90 140 C88 152 92 162 98 168 L90 180 L112 176 L108 152 L104 160 C100 150 104 132 118 128 C132 124 148 132 150 150 L152 162 Z"/>
  <!-- chain + stolen (dead) lantern cage -->
  <path fill="#1C1A1E" d="M99 178 L103 178 L103 196 L99 196 Z"/>
  <path fill="#1C1A1E" fill-rule="evenodd" d="
    M88 196 L114 196 L120 206 L120 240 L114 248 L88 248 L82 240 L82 206 Z
    M88 208 L98 208 L98 238 L88 238 Z
    M104 208 L114 208 L114 238 L104 238 Z"/>
