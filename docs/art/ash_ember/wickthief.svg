  <path fill="#1C1A1E" d="
    M284 214
    Q296 190 318 170 L344 140 L316 160
    Q296 168 280 176
    Q266 164 244 164
    Q222 164 206 180
    L132 258
    Q158 254 176 266
    Q198 290 234 290
    Q272 284 284 214 Z"/>
  <path fill="none" stroke="#2E2B33" stroke-width="2.5" stroke-linecap="round" d="M284 214 Q278 256 252 278"/>
  <!-- hood mouth void -->
  <path fill="#0B0A0C" d="M154 256 L196 222 Q216 216 224 236 Q228 258 212 272 Q196 282 182 270 Q170 260 154 256 Z"/>

  <!-- near leg: reverse knee, long toes -->
  <path fill="#1C1A1E" d="M270 344 L236 396 L262 438 L254 448 L222 464 L188 476 L170 478 L176 470 L212 458 L240 442 L218 400 L248 344 Z"/>
  <path fill="#1C1A1E" d="M226 466 L202 480 L216 480 L234 470 Z"/>

  <!-- near arm: sharp elbow, claws wrapped on the staff -->
  <path fill="#1C1A1E" d="M240 262 L212 318 L170 296 L160 290 L148 284 L162 294 L144 292 L162 302 L146 304 L166 308 L206 332 L224 330 L256 274 Z"/>

  <!-- rim light on lantern-facing edges -->
  <path fill="none" stroke="#3A3640" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M244 164 Q222 164 206 180 L132 258"/>
  <path fill="none" stroke="#3A3640" stroke-width="2.5" stroke-linecap="round" d="M164 160 L136 478"/>
  <path fill="none" stroke="#3A3640" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M248 344 L218 400 L240 442"/>

  <!-- candle stub on the hood crown, wax running down -->
