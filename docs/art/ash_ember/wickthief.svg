  <path fill="#2A262C" d="M234 148 Q226 160 222 182 L230 182 L234 160 Z"/>
  <path fill="#2A262C" d="M250 144 Q258 156 258 170 L253 172 Z"/>
  <path fill="#0B0A0C" d="M241 136 L243 136 L243 127 L241 127 Z"/>
  <!-- flame (the only warm color) -->
  <circle cx="242" cy="110" r="36" fill="#F2A541" fill-opacity="0.07"/>
  <circle cx="242" cy="112" r="20" fill="#F2A541" fill-opacity="0.15"/>
  <path fill="#F2A541" d="M243 86 Q256 104 250 120 Q242 128 234 120 Q230 104 243 86 Z"/>
  <path fill="#FFD27A" d="M242 102 Q248 110 245 120 Q241 124 238 119 Q237 110 242 102 Z"/>

  <!-- gloam eyes: slanted slits -->
